name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  variants:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      variants: ${{ steps.variants.outputs.variants }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Variants
        id: variants
        run: |
          if [ -f .starter-kit/teams/manifest.json ]; then
            echo 'variants=["base","teams"]' >> "$GITHUB_OUTPUT"
          else
            echo 'variants=["base"]' >> "$GITHUB_OUTPUT"
          fi

  ci:
    name: ci (${{ matrix.variant }})
    needs: variants
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJson(needs.variants.outputs.variants) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare Variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = "teams" ]; then
            cp -R .starter-kit/teams/files/. .
            jq -r '.deleted[]' .starter-kit/teams/manifest.json | while IFS= read -r file; do rm -f -- "$file"; done
          fi
          rm -rf .starter-kit

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug
          ini-values: zend.assertions=1

      - name: Cache Composer Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress --no-scripts
          composer run-script post-autoload-dump

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Prepare Database
        run: |
          php -r "file_exists('database/database.sqlite') || touch('database/database.sqlite');"
          php artisan migrate --force --no-interaction

      - name: Cache Rector
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/rector
          key: ${{ runner.os }}-rector-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-rector-

      - name: Cache PHPStan
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/phpstan
          key: ${{ runner.os }}-phpstan-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-phpstan-

      - name: Create Cache Directories
        run: mkdir -p tmp/rector tmp/phpstan

      - name: Tests
        run: composer test

