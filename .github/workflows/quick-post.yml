name: quick post

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      kits:
        description: Kits to post, separated by commas (for example react,svelte). Leave empty to post every kit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: quick-post
  cancel-in-progress: false

jobs:
  kits-matrix:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.kits.outputs.kits }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Kits
        id: kits
        env:
          SELECTED: ${{ inputs.kits }}
        run: |
          echo "kits=$(jq -c --arg selected "$SELECTED" '($selected | split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(. != ""))) as $only | [.kits | to_entries[] | select(.value.base == null) | select(($only | length) == 0 or (.key as $k | $only | index($k))) | {name: .key, label: .value.label, repository: .value.repository}]' hobbiton.json)" >> "$GITHUB_OUTPUT"

  post:
    name: Post ${{ matrix.kit.label }}
    needs: kits-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.kits-matrix.outputs.kits) }}

    steps:
      - name: Checkout Hobbiton
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Install Hobbiton Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pack ${{ matrix.kit.label }}
        run: php artisan pack --kit=${{ matrix.kit.name }} --to=${{ runner.temp }}/kit

      - name: Checkout ${{ matrix.kit.repository }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.kit.repository }}
          path: starter-kit
          token: ${{ secrets.STARTER_KIT_TOKEN }}
          fetch-depth: 0

      - name: Open or Update the Pull Request
        working-directory: starter-kit
        env:
          GH_TOKEN: ${{ secrets.STARTER_KIT_TOKEN }}
          BRANCH: hobbiton/quick-post
          COMMIT_MESSAGE: "${{ github.event.head_commit.message || 'chore: sync from Hobbiton' }}"
          SOURCE: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Build on the open quick post pull request when there is one, so it collects every post until it is merged.
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$pr" ]; then
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" FETCH_HEAD
          else
            git checkout -B "$BRANCH"
          fi

          rsync -a --delete --exclude=/.git "${{ runner.temp }}/kit/" ./
          git add -A

          if git diff --cached --quiet; then
            echo "No changes for ${{ matrix.kit.label }}."
            exit 0
          fi

          git commit --message="$(printf '%s\n\nPosted from Hobbiton: %s' "$COMMIT_MESSAGE" "$SOURCE")"
          git push --force origin "HEAD:$BRANCH"

          body="$(printf 'Posted from [Hobbiton](%s/%s). Edit the kit in Hobbiton rather than on this branch, since every post replaces its files.\n\n%s' "${{ github.server_url }}" "${{ github.repository }}" "$(git log origin/main..HEAD --format='- %s')")"

          if [ -n "$pr" ]; then
            gh pr edit "$pr" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "$(printf '%s' "$COMMIT_MESSAGE" | head -n 1)" --body "$body"
          fi
