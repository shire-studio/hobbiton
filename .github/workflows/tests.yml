name: tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hobbiton:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: none

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Tests
        run: composer test

  kits-matrix:
    runs-on: ubuntu-latest
    outputs:
      kits: ${{ steps.kits.outputs.kits }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read Kits
        id: kits
        run: echo "kits=$(jq -c '[.kits | to_entries[] | {name: .key, label: .value.label, node: .value.node}]' hobbiton.json)" >> "$GITHUB_OUTPUT"

  kits:
    name: ${{ matrix.kit.label }}
    needs: kits-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        kit: ${{ fromJson(needs.kits-matrix.outputs.kits) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: 8.5
          tools: composer:v2
          coverage: xdebug
          ini-values: zend.assertions=1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Install Hobbiton Dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Install Playwright Browsers
        if: matrix.kit.node
        run: npx --yes playwright install --with-deps chromium

      - name: Survey ${{ matrix.kit.label }}
        run: node scripts/survey.js --${{ matrix.kit.name }}
